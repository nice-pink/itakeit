    - generic [ref=f1e51]:
      - heading "How it works" [level=2] [ref=f1e52]
      - paragraph [ref=f1e53]: One dedicated channel. No forms, no extra tool, no context switch.
      - generic [ref=f1e54]:
        - article [ref=f1e55]:
          - generic [ref=f1e56]: 📝
          - heading "Every message is a task" [level=3] [ref=f1e57]
          - paragraph [ref=f1e58]: Post an issue in the channel. The bot replies in its thread with a status card.
        - article [ref=f1e59]:
          - generic [ref=f1e60]: 🙋
          - heading "Claim with one reaction" [level=3] [ref=f1e61]
          - paragraph [ref=f1e62]: React 🙋 to take it. Several people can own a task. Remove the reaction to hand it back.
        - article [ref=f1e63]:
          - generic [ref=f1e64]: 🚧
          - heading "Status by emoji" [level=3] [ref=f1e65]
          - paragraph [ref=f1e66]: Owners react 👀 investigating, 🚧 in progress, ⛔ blocked or ✅ done. The latest reaction wins.
        - article [ref=f1e67]:
          - generic [ref=f1e68]: ❓
          - heading "Ask the reporter" [level=3] [ref=f1e69]
          - paragraph [ref=f1e70]: ❓ pings the reporter in the thread. Their reply pings the owners and clears the status.
        - article [ref=f1e71]:
          - generic [ref=f1e72]: 📌
          - heading "A pinned board" [level=3] [ref=f1e73]
          - paragraph [ref=f1e74]: One pinned message lists every open task with its status and owners, always current.
        - article [ref=f1e75]:
          - generic [ref=f1e76]: ⏰
          - heading "Nudges for stale work" [level=3] [ref=f1e77]
          - paragraph [ref=f1e78]: Owners who go quiet on a task get a reminder in the thread after a configurable number of hours.
