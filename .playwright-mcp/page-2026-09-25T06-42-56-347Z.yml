    - generic [ref=f2e49]:
      - heading "How it works" [level=2] [ref=f2e50]
      - paragraph [ref=f2e51]: One dedicated channel. No forms, no extra tool, no context switch.
      - generic [ref=f2e52]:
        - article [ref=f2e53]:
          - generic [ref=f2e54]: 📝
          - heading "Every message is a task" [level=3] [ref=f2e55]
          - paragraph [ref=f2e56]: Post an issue in the channel. The bot replies in its thread with a status card.
        - article [ref=f2e57]:
          - generic [ref=f2e58]: 🙋
          - heading "Claim with one reaction" [level=3] [ref=f2e59]
          - paragraph [ref=f2e60]: React 🙋 to take it. Several people can own a task. Remove the reaction to hand it back.
        - article [ref=f2e61]:
          - generic [ref=f2e62]: 🚧
          - heading "Status by emoji" [level=3] [ref=f2e63]
          - paragraph [ref=f2e64]: Owners react 👀 investigating, 🚧 in progress, ⛔ blocked or ✅ done. The latest reaction wins.
        - article [ref=f2e65]:
          - generic [ref=f2e66]: ❓
          - heading "Ask the reporter" [level=3] [ref=f2e67]
          - paragraph [ref=f2e68]: ❓ pings the reporter in the thread. Their reply pings the owners and clears the status.
        - article [ref=f2e69]:
          - generic [ref=f2e70]: 📌
          - heading "A pinned board" [level=3] [ref=f2e71]
          - paragraph [ref=f2e72]: One pinned message lists every open task with its status and owners, always current.
        - article [ref=f2e73]:
          - generic [ref=f2e74]: ⏰
          - heading "Nudges for stale work" [level=3] [ref=f2e75]
          - paragraph [ref=f2e76]: Owners who go quiet on a task get a reminder in the thread after a configurable number of hours.
