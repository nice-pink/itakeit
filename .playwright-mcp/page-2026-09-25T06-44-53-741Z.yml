    - generic [ref=f3e49]:
      - heading "How it works" [level=2] [ref=f3e50]
      - paragraph [ref=f3e51]: One dedicated channel. No forms, no extra tool, no context switch.
      - generic [ref=f3e52]:
        - article [ref=f3e53]:
          - generic [ref=f3e54]: 📝
          - heading "Every message is a task" [level=3] [ref=f3e55]
          - paragraph [ref=f3e56]: Post an issue in the channel. The bot replies in its thread with a status card.
        - article [ref=f3e57]:
          - generic [ref=f3e58]: 🙋
          - heading "Claim with one reaction" [level=3] [ref=f3e59]
          - paragraph [ref=f3e60]: React 🙋 to take it. Several people can own a task. Remove the reaction to hand it back.
        - article [ref=f3e61]:
          - generic [ref=f3e62]: 🚧
          - heading "Status by emoji" [level=3] [ref=f3e63]
          - paragraph [ref=f3e64]: Owners react 👀 investigating, 🚧 in progress, ⛔ blocked or ✅ done. The latest reaction wins.
        - article [ref=f3e65]:
          - generic [ref=f3e66]: ❓
          - heading "Ask the reporter" [level=3] [ref=f3e67]
          - paragraph [ref=f3e68]: ❓ pings the reporter in the thread. Their reply pings the owners and clears the status.
        - article [ref=f3e69]:
          - generic [ref=f3e70]: 📌
          - heading "A pinned board" [level=3] [ref=f3e71]
          - paragraph [ref=f3e72]: One pinned message lists every open task with its status and owners, always current.
        - article [ref=f3e73]:
          - generic [ref=f3e74]: ⏰
          - heading "Nudges for stale work" [level=3] [ref=f3e75]
          - paragraph [ref=f3e76]: Owners who go quiet on a task get a reminder in the thread after a configurable number of hours.
