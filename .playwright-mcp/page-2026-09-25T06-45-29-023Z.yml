    - generic [ref=f4e49]:
      - heading "How it works" [level=2] [ref=f4e50]
      - paragraph [ref=f4e51]: One dedicated channel. No forms, no extra tool, no context switch.
      - generic [ref=f4e52]:
        - article [ref=f4e53]:
          - generic [ref=f4e54]: 📝
          - heading "Every message is a task" [level=3] [ref=f4e55]
          - paragraph [ref=f4e56]: Post an issue in the channel. The bot replies in its thread with a status card.
        - article [ref=f4e57]:
          - generic [ref=f4e58]: 🙋
          - heading "Claim with one reaction" [level=3] [ref=f4e59]
          - paragraph [ref=f4e60]: React 🙋 to take it. Several people can own a task. Remove the reaction to hand it back.
        - article [ref=f4e61]:
          - generic [ref=f4e62]: 🚧
          - heading "Status by emoji" [level=3] [ref=f4e63]
          - paragraph [ref=f4e64]: Owners react 👀 investigating, 🚧 in progress, ⛔ blocked or ✅ done. The latest reaction wins.
        - article [ref=f4e65]:
          - generic [ref=f4e66]: ❓
          - heading "Ask the reporter" [level=3] [ref=f4e67]
          - paragraph [ref=f4e68]: ❓ pings the reporter in the thread. Their reply pings the owners and clears the status.
        - article [ref=f4e69]:
          - generic [ref=f4e70]: 📌
          - heading "A pinned board" [level=3] [ref=f4e71]
          - paragraph [ref=f4e72]: One pinned message lists every open task with its status and owners, always current.
        - article [ref=f4e73]:
          - generic [ref=f4e74]: ⏰
          - heading "Nudges for stale work" [level=3] [ref=f4e75]
          - paragraph [ref=f4e76]: Owners who go quiet on a task get a reminder in the thread after a configurable number of hours.
