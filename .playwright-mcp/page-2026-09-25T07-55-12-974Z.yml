            - code [ref=e91]: groups:history
            - text: ","
            - code [ref=e92]: chat:write
            - text: ","
            - code [ref=e93]: reactions:read
            - text: and
            - code [ref=e94]: pins:write
            - text: .
        - listitem [ref=e95]:
