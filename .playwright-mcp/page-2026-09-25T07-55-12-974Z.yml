    - generic [ref=e51]:
      - heading "How it works" [level=2] [ref=e52]
      - paragraph [ref=e53]: One dedicated channel. No forms, no extra tool, no context switch.
      - generic [ref=e54]:
        - article [ref=e55]:
          - generic [ref=e56]: 📝
          - heading "Every message is a task" [level=3] [ref=e57]
          - paragraph [ref=e58]: Post an issue in the channel. The bot replies in its thread with a status card.
        - article [ref=e59]:
          - generic [ref=e60]: 🙋
          - heading "Claim with one reaction" [level=3] [ref=e61]
          - paragraph [ref=e62]: React 🙋 to take it. Several people can own a task. Remove the reaction to hand it back.
        - article [ref=e63]:
          - generic [ref=e64]: 🚧
          - heading "Status by emoji" [level=3] [ref=e65]
          - paragraph [ref=e66]: Owners react 👀 investigating, 🚧 in progress, ⛔ blocked or ✅ done. The latest reaction wins.
        - article [ref=e67]:
          - generic [ref=e68]: ❓
          - heading "Ask the reporter" [level=3] [ref=e69]
          - paragraph [ref=e70]: ❓ pings the reporter in the thread. Their reply pings the owners and clears the status.
        - article [ref=e71]:
          - generic [ref=e72]: 📌
          - heading "A pinned board" [level=3] [ref=e73]
          - paragraph [ref=e74]: One pinned message lists every open task with its status and owners, always current.
        - article [ref=e75]:
          - generic [ref=e76]: ⏰
          - heading "Nudges for stale work" [level=3] [ref=e77]
          - paragraph [ref=e78]: Owners who go quiet on a task get a reminder in the thread after a configurable number of hours.
