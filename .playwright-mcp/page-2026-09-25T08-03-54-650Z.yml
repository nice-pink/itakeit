    - generic [ref=f4e51]:
      - heading "How it works" [level=2] [ref=f4e52]
      - paragraph [ref=f4e53]: One dedicated channel. No forms, no extra tool, no context switch.
      - generic [ref=f4e54]:
        - article [ref=f4e55]:
          - generic [ref=f4e56]: 📝
          - heading "Every message is a task" [level=3] [ref=f4e57]
          - paragraph [ref=f4e58]: Post an issue in the channel. The bot replies in its thread with a status card.
        - article [ref=f4e59]:
          - generic [ref=f4e60]: 🙋
          - heading "Claim with one reaction" [level=3] [ref=f4e61]
          - paragraph [ref=f4e62]: React 🙋 to take it. Several people can own a task. Remove the reaction to hand it back.
        - article [ref=f4e63]:
          - generic [ref=f4e64]: 🚧
          - heading "Status by emoji" [level=3] [ref=f4e65]
          - paragraph [ref=f4e66]: Owners react 👀 investigating, 🚧 in progress, ⛔ blocked or ✅ done. The latest reaction wins.
        - article [ref=f4e67]:
          - generic [ref=f4e68]: ❓
          - heading "Ask the reporter" [level=3] [ref=f4e69]
          - paragraph [ref=f4e70]: ❓ pings the reporter in the thread. Their reply pings the owners and clears the status.
        - article [ref=f4e71]:
          - generic [ref=f4e72]: 📌
          - heading "A pinned board" [level=3] [ref=f4e73]
          - paragraph [ref=f4e74]: One pinned message lists every open task with its status and owners, always current.
        - article [ref=f4e75]:
          - generic [ref=f4e76]: ⏰
          - heading "Nudges for stale work" [level=3] [ref=f4e77]
          - paragraph [ref=f4e78]: Owners who go quiet on a task get a reminder in the thread after a configurable number of hours.
