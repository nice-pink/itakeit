# IDs of the channels the bot serves (not their names). Find one under channel details ->
# About. Each channel has its own tasks and board; all share the settings below. The bot
# must be invited to each. A single `channel: C0123456789` is still accepted.
# channels:
#   - C0123456789

# Instead of channels: serve every public or private channel the bot is a member of.
# Inviting the bot then makes a channel a task channel, and removing it stops the bot
# there. Needs the channels:read and groups:read scopes from the current manifest.
# A `channel:` key next to it is ignored, so a config shared with an older
# itakeit-agent can keep its channel. itakeit-agent reads the same channels and
# auto_channels keys.
auto_channels: true

# SQLite file holding owners, statuses and the board message timestamp. Ignored when
# a Postgres URL is set.
db_path: itakeit.db

# Postgres URL. When set, Postgres is used instead of the SQLite file. The
# ITAKEIT_DATABASE_URL environment variable overrides it; prefer that, since this
# file would otherwise hold the database password.
# database_url: postgres://itakeit:secret@db:5432/itakeit

# Owners of a claimed/investigating/in-progress task get one thread reminder after
# this many hours without a claim, status change or thread reply from an owner.
stale_after_hours: 48

# Maximum tasks listed on the pinned board, oldest first. The counts per status at
# the top of the board always include every open task.
board_max_tasks: 50

# Done tasks are deleted from the database once they have had no activity for this
# many days, checked hourly. Messages and cards in Slack are kept. -1 keeps them forever.
done_retain_days: 30

# Slack user ID (not a name) asked for details when someone reacts needs_info on a task
# posted by a bot or integration. Without it the bot's name is posted as plain text and
# nobody is pinged. Replies from this user clear needs_info, as a reporter's would.
# bot_contact: U0123456789
# Per-channel override by channel ID. Works with auto_channels too, since the keys need
# not be listed in channels. Channels not listed here use bot_contact.
# bot_contacts:
#   C0123456789: U0123456789

# false: only owners (who reacted with claim) can set a status. true: any status
# reaction makes the reactor an owner, who stays one until they have no claim or
# status reaction left on the task message.
status_claims: false

# Action -> reaction names. The first emoji of each action is the one shown in
# cards and on the board. Omit an action to disable it. If this block is present
# it replaces the defaults entirely. Actions: claim (required), investigating,
# in_progress, needs_info, blocked, done.
emoji:
  claim: [raising_hand]
  investigating: [eyes]
  in_progress: [construction]
  needs_info: [question]
  blocked: [no_entry]
  done: [white_check_mark]
